name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 of both, because v4 runs on Node 20 — deprecated on GitHub runners
      # since September 2025 and already being force-run on Node 24, which is
      # the warning every build was printing.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build's last step renders the landing page in headless Chromium and
      # bakes the result into dist/index.html (scripts/prerender.mjs), because
      # a page that ships as an empty <div id="root"> has nothing for a crawler
      # to index. If this install fails the build fails — deploying an
      # unindexable shell while believing otherwise is the state that step
      # exists to end, and the previous deploy stays up meanwhile.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          # Required — sign-in is mandatory and analysis is proxied through a
          # Supabase Edge Function, so the site can't function without these.
          # Set as repository secrets: Settings → Secrets and variables → Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: your account email(s), comma-separated. Unlocks the
          # owner-only layout/design tools when you're signed in.
          VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
